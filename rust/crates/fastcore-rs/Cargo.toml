[package]
name = "fastcore-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"

[lib]
name = "fastcore_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
kakeya-core = { path = "../kakeya-core", version = "0.1.0" }
pyo3 = { version = "=0.29.2", features = ["abi3-py39", "extension-module"] }
